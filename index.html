
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#105fc7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Vitex CRM - Business Management System">
  <title>Vitex CRM | Opening Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, Arial, sans-serif;
      color: #172b4d;
      background: linear-gradient(145deg, #eaf3ff, #f7faff);
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 38px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5edf7;
      border-radius: 20px;
      box-shadow: 0 18px 55px #173c6812;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      color: white;
      background: linear-gradient(145deg, #105fc7, #2386e8);
      font-size: 31px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: #145fc5;
      font-size: 24px;
    }

    p {
      margin: 10px 0 23px;
      color: #718096;
      font-size: 13px;
      line-height: 1.6;
    }

    .loader {
      width: 30px;
      height: 30px;
      margin: 0 auto 15px;
      border: 3px solid #dceaff;
      border-top-color: #145fc5;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .status {
      color: #145fc5;
      font-size: 12px;
      font-weight: 600;
    }

    .manual-link {
      display: inline-block;
      margin-top: 20px;
      color: #145fc5;
      font-size: 13px;
      text-decoration: none;
      font-weight: 700;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">V</div>

    <h1>VITEX CRM</h1>

    <p>
      Business Management System
      <br>
      Opening your dashboard...
    </p>

    <div class="loader"></div>

    <div class="status" id="status">
      Please wait...
    </div>

    <a class="manual-link" href="dashboard.html">
      Open Dashboard
    </a>
  </main>

  <script>
    // Temporary direct dashboard redirect for testing.
    // This does NOT authenticate or authorise users.

    document.getElementById("status").textContent =
      "Redirecting to dashboard...";

    window.location.replace("dashboard.html");
  </script>
</body>
</html>
